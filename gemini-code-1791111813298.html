<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDUNUZ - WhatsApp Topluluğu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #161b22;
            border: 1px solid #00f0ff;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.25);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        .logo span {
            color: #00f0ff;
        }

        .subtitle {
            color: #8b949e;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .info-card {
            background: #21262d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid #30363d;
        }

        .info-card p {
            font-size: 0.9rem;
            color: #c9d1d9;
            line-height: 1.5;
        }

        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #25d366;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 16px 24px;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            background: #20ba5a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
        }

        .btn-whatsapp i {
            font-size: 1.5rem;
        }

        .footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">ORDUNUZ <span>SHOP</span></div>
        <p class="subtitle">Resmi WhatsApp Topluluk Grubu</p>

        <div class="info-card">
            <p>Özel indirimler, anlık stok güncellemeleri ve sohbet ortamı için WhatsApp grubumuza katılabilirsiniz.</p>
        </div>

        <!-- BURADAKİ LİNKİ KENDİ WHATSAPP GRUP LİNKİNLE DEĞİŞTİR -->
        <a href="https://chat.whatsapp.com/LİNKİNİZ" class="btn-whatsapp" target="_blank">
            <i class="fa-brands fa-whatsapp"></i> Gruba Katıl
        </a>

        <div class="footer">
            © 2026 ORDUNUZ. Tüm hakları saklıdır.
        </div>
    </div>

</body>
</html>
